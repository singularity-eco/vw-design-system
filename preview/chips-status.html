<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../colors.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{background:var(--color-surface);padding:20px;margin:0;font-family:Inter,system-ui;color:var(--color-ink-1);}
  .chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font:500 12px/18px Inter;box-sizing:border-box;}
</style>
</head>
<body>
<div style="display:flex;flex-wrap:wrap;gap:6px;max-width:640px;">
  <span class="chip" style="background:var(--vw-color-emerald-100);color:var(--vw-color-emerald-700);">Verified</span>
  <span class="chip" style="background:var(--vw-color-emerald-100);color:var(--vw-color-emerald-700);">Submitted</span>
  <span class="chip" style="background:var(--vw-color-emerald-100);color:var(--vw-color-emerald-700);">Closed won</span>
  <span class="chip" style="background:var(--vw-color-red-100);color:var(--vw-color-red-700);">Error</span>
  <span class="chip" style="background:var(--vw-color-red-100);color:var(--vw-color-red-700);">Failed</span>
  <span class="chip" style="background:var(--vw-color-red-100);color:var(--vw-color-red-700);">Rejected</span>
  <span class="chip" style="background:var(--vw-color-orange-100);color:var(--vw-color-orange-700);">Yet to start</span>
  <span class="chip" style="background:var(--vw-color-orange-100);color:var(--vw-color-orange-700);">On hold</span>
  <span class="chip" style="background:var(--vw-color-yellow-100);color:var(--vw-color-yellow-700);">Pending</span>
  <span class="chip" style="background:var(--vw-color-accent-100);color:var(--vw-color-accent-700);">In progress</span>
  <span class="chip" style="background:var(--vw-color-accent-100);color:var(--vw-color-accent-700);">New</span>
  <span class="chip" style="background:var(--vw-color-cyan-100);color:var(--vw-color-cyan-700);">Active</span>
  <span class="chip" style="background:var(--color-surface-muted);color:var(--color-ink-2);">Draft</span>
  <span class="chip" style="background:var(--color-surface-muted);color:var(--color-ink-2);">Archived</span>
</div>
<div style="margin-top:16px;font:400 11px/16px ui-monospace,monospace;color:var(--color-ink-3);">padding: 2px 8px &nbsp;·&nbsp; radius: 999px &nbsp;·&nbsp; font: 500 12/18 Inter</div>
</body></html>
